# The till apps, built by CI so no laptop ever needs the toolchains.
#
# Android produces a real, sideloadable debug APK as a build artifact —
# download it from the Actions run page and install it on a till tablet.
# iOS builds against the simulator SDK purely as a compile check (a signed
# .ipa needs the Apple Developer account and certificates; that step is
# added when the account exists).
#
# Triggers only when native code or this workflow changes — the shell wraps
# the deployed web app, so web-only pushes don't need a rebuild.

name: till-apps

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "capacitor-shell/**"
      - ".github/workflows/till-apps.yml"
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: vinpos-till-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-compile-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx cap sync ios
      - run: >
          xcodebuild -project App.xcodeproj -scheme App
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: ios/App
